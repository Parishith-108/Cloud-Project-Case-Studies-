name: LocalStack Threat Detection CI

on:
  push:
    paths:
      - 'local-cloud-threat-detection-compliance-engine/**'
  pull_request:
    paths:
      - 'local-cloud-threat-detection-compliance-engine/**'

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: local-cloud-threat-detection-compliance-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Start LocalStack
        working-directory: local-cloud-threat-detection-compliance-engine
        run: |
          docker compose up -d
          for i in {1..20}; do
            if curl --fail http://localhost:4566/health; then
              echo "LocalStack is healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Initialize mock cloud resources
        working-directory: local-cloud-threat-detection-compliance-engine
        run: python -m local_cloud_threat_detection.cli --init

      - name: Run scanner against LocalStack
        working-directory: local-cloud-threat-detection-compliance-engine
        run: python -m local_cloud_threat_detection.cli --output compliance-findings-ci.json

      - name: Run remediation flow
        working-directory: local-cloud-threat-detection-compliance-engine
        run: python -m local_cloud_threat_detection.cli --fix --output compliance-findings-post-fix.json

      - name: Run unit tests
        working-directory: local-cloud-threat-detection-compliance-engine
        run: python -m pytest tests

      - name: Tear down LocalStack
        if: always()
        working-directory: local-cloud-threat-detection-compliance-engine
        run: docker compose down

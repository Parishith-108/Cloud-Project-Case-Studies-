name: IaC Security Scan

on:
  push:
    paths:
      - 'devsecops-iac-security-pipeline/**'
  pull_request:
    paths:
      - 'devsecops-iac-security-pipeline/**'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.55.0
          trivy --version

      - name: Run Checkov scan
        run: |
          checkov -d devsecops-iac-security-pipeline/terraform --output sarif --output-file checkov-report.sarif --soft-fail
          checkov -d devsecops-iac-security-pipeline/terraform --output json --output-file checkov-report.json --soft-fail

      - name: Run Trivy IaC scan
        run: |
          trivy config --format sarif --output trivy-report.sarif devsecops-iac-security-pipeline/terraform
          trivy config --format json --output trivy-report.json devsecops-iac-security-pipeline/terraform

      - name: Upload SARIF reports
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            checkov-report.sarif
            trivy-report.sarif

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iac-security-reports
          path: |
            checkov-report.sarif
            checkov-report.json
            trivy-report.sarif
            trivy-report.json

      - name: Fail build on critical findings
        run: |
          python - <<'PY'
import json
from pathlib import Path
errors = []

if Path('checkov-report.json').exists():
    checkov_report = json.loads(Path('checkov-report.json').read_text())
    failed = checkov_report.get('results', {}).get('failed_checks', [])
    if failed:
        errors.append(f"Checkov failed checks: {len(failed)}")

if Path('trivy-report.json').exists():
    trivy_report = json.loads(Path('trivy-report.json').read_text())
    critical = [item for item in trivy_report.get('Results', []) if item.get('Severity') == 'CRITICAL']
    if critical:
        errors.append(f"Trivy critical issues: {len(critical)}")

if errors:
    print('Build failure due to security findings:')
    for error in errors:
        print(f'- {error}')
    raise SystemExit(1)
PY
